# Full replacement for the stock /etc/nginx/nginx.conf .
#
# Runs as the non-root `nginx` user that ships in the nginx:alpine image --
# there is no root master process here to bind privileged ports or own
# /var/run, so this file deliberately avoids both:
#   - listens on 8080, not 80 (binding <1024 needs root/CAP_NET_BIND_SERVICE)
#   - pid file and all temp paths live under /tmp, which is world-writable,
#     instead of /var/run and /var/cache/nginx which a non-root user cannot
#     write to without extra chowning
#   - access/error logs go straight to stdout/stderr (character devices,
#     always writable) instead of files under /var/log/nginx
#
# See the Dockerfile for how this file gets in place and how the non-root
# user is verified.

pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root-writable temp paths (default nginx.conf points these at
    # /var/cache/nginx/*, which the nginx user cannot write to here).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Baseline security headers. No Content-Security-Policy: this is a
        # single-page app that talks to a separately-configured API origin
        # (API_BASE_URL, baked in at build time -- see the Dockerfile),
        # and a CSP tight enough to matter has to be verified against the
        # actual bundle before shipping. Left for a follow-up once that
        # verification is done, rather than guessed at here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Hashed Angular build output (main-ABC123.js, chunk-ABC123.js,
        # styles-ABC123.css, written to the web root) never changes contents
        # under a given URL, so it is safe to cache forever. A missing file
        # here must 404, not fall back to the SPA shell -- that would hide a
        # broken-asset bug as a blank page instead of a loud 404.
        location ~* "^/(main|chunk|polyfills|styles)-[A-Z0-9]{8}\.(js|css)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The SPA shell references the current build's hashed bundles by
        # name, so it must always be revalidated -- caching it would mean a
        # redeploy leaves already-open tabs (and any proxy/CDN cache) serving
        # an index.html that points at bundles which no longer exist.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # SPA fallback: Angular Router owns everything else client-side, so a
        # hard refresh or direct link to e.g. /receipt/16 must still return
        # the app shell (200) rather than nginx's own 404 -- $uri and $uri/
        # are tried first so real files (favicon, etc.) are still served
        # directly.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
